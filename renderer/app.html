<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- blob: es para el worker de hls.js; https: para miniaturas y segmentos. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    worker-src 'self' blob:;
    style-src 'self' 'unsafe-inline';
    img-src 'self' https: data:;
    media-src 'self' https: blob: http://127.0.0.1:*;
    connect-src 'self' https: http://127.0.0.1:*;">
  <title>CHZZK Player</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- ------------------------------------------------------- cabecera -->
  <header class="topbar">
    <button class="icon-btn nav-toggle" id="navToggle" title="Menú" aria-label="Menú">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>

    <a class="brand" href="#/category/GAME/Lost_Ark" id="brand">
      <span class="brand-mark">치</span>
      <span class="brand-text">CHZZK</span>
    </a>

    <form class="search" id="searchForm" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="searchInput" type="search" placeholder="Busca canales o directos"
             autocomplete="off" spellcheck="false" aria-label="Buscar">
      <button type="button" class="search-clear" id="searchClear" hidden aria-label="Limpiar">×</button>
    </form>

    <div class="topbar-actions">
      <button class="icon-btn" id="openManual" title="Reproducir una URL .m3u8" aria-label="URL manual">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 13a5 5 0 007.5.5l2-2a5 5 0 00-7-7l-1 1"/>
          <path d="M14 11a5 5 0 00-7.5-.5l-2 2a5 5 0 007 7l1-1"/>
        </svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="Actualizar" aria-label="Actualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 5v6h-6"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- -------------------------------------------------------- sidebar -->
  <aside class="sidebar" id="sidebar">
    <nav class="side-nav">
      <a class="side-link" data-route="#/category/GAME/Lost_Ark" href="#/category/GAME/Lost_Ark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M9 10l5 2-5 2z" class="fill"/></svg>
        <span>Lost Ark CHZZK</span>
      </a>
      <a class="side-link" data-route="#/vods" href="#/vods">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
        <span>Pasados CHZZK</span>
      </a>
      <a class="side-link" data-route="#/bilibili" href="#/bilibili">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 3l3 4M16 3l-3 4"/><path d="M8.5 12.5v2M15.5 12.5v2"/></svg>
        <span>Bilibili Lost Ark</span>
      </a>
      <a class="side-link" data-route="#/detected" href="#/detected">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 8v8M19 8v8"/></svg>
        <span>Detectados</span>
      </a>
    </nav>

    <section class="side-section" id="favSection" hidden>
      <h2 class="side-title">Favoritos</h2>
      <ul class="chan-list" id="favList"></ul>
    </section>

    <section class="side-section">
      <h2 class="side-title">Lost Ark en directo</h2>
      <ul class="chan-list" id="recList">
        <li class="chan-skeleton"></li>
        <li class="chan-skeleton"></li>
        <li class="chan-skeleton"></li>
      </ul>
    </section>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <!-- ----------------------------------------------------------- main -->
  <main class="main" id="main"></main>

  <!-- ------------------------------------------------ diálogo URL manual -->
  <dialog class="sheet" id="manualDialog">
    <form method="dialog" class="sheet-inner" id="manualForm">
      <h2>Reproducir una URL</h2>
      <p class="sheet-hint">Pega cualquier enlace <code>.m3u8</code> y se abrirá en el reproductor.</p>
      <input id="manualInput" type="url" placeholder="https://….m3u8" spellcheck="false" required>
      <div class="sheet-actions">
        <button value="cancel" class="btn ghost" type="submit">Cancelar</button>
        <button value="play" class="btn primary" type="submit">Reproducir</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>

  <script src="hls.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
